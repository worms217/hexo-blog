# Dark Mode
# 是否开启暗色模式（true/false）
dark: false

# Header 导航菜单
menu:
  Home: /
  Archives: /archives
  About: /about
  Tags: /tags
  Categories: /categories

# RSS 订阅地址
template_rss: /atom.xml

# 特殊功能
# Fancybox 图片预览
fancybox: true
# 文章摘要后 “Read More” 链接文字
excerpt_link: 'Read More'

# 杂项
# Google Analytics 跟踪 ID
google\_analytics:
favicon: /favicon.ico
twitter:
google\_plus:
fb\_admins:
fb\_app\_id:

# 社交账号（启用 FontAwesome 图标）
icons: true
links:
  book: /archives/
  github-alt: https://github.com/worms217
  bilibili: https://space.bilibili.com/1755511789?spm_id_from=333.1007.0.0
  rss: /atom.xml

# 导航位置 (top, left)，默认 top
nav: top

