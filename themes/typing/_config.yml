# 评论系统配置
# Gitment
gitment:
  enable: false          # 是否启用 Gitment 评论
  owner: worms217        # 仓库拥有者
  repo: comments         # 用于存储评论的仓库名
  client:
    id: YOUR_GITMENT_CLIENT_ID
    secret: YOUR_GITMENT_CLIENT_SECRET

# Utterances
utterances:
  enable: false          # 是否启用 Utterances 评论
  repo: worms217/typing-comments  # GitHub 仓库名

# Valine
valine:
  enable: false          # 是否启用 Valine 评论
  appId: YOUR_LEANCLOUD_APPID
  appKey: YOUR_LEANCLOUD_APPKEY
  guest_info: nick,mail,link
  placeholder: 留言是一种美好
  avatar: mm
  pageSize: 10
  verify: false
  notify: false
  lang: zh-cn


# 打赏 Donate（可在文章末尾显示）
donate:
  enable: true           # 是否显示打赏按钮
  github: https://github.com/worms217
  paypal: https://www.paypal.me/worms217
  bitcoin: YOUR_BITCOIN_ADDRESS
  BTCQR: /images/btc_qr.png
  AliPayQR: /images/alipay_qr.png
  WeChatQR: /images/wechat_qr.png
