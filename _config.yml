# 全局站点配置
title: 智能乱码虫的博客
subtitle: '111'
description: '后现代人人自嬷'   # 全站简介（可省略，主题一般不引用）
author: 智能乱码虫
language: zh-CN
timezone: ''     # 如需本地化，可以填写 Asia/Shanghai
keywords:       # SEO 关键词
  - Hexo
  - 博客
  - Typing

# URL 设置（必须指向你的 GitHub Pages 地址）
url: https://worms217.github.io
root: /

# 文章永久链接
permalink: :year/:month/:day/:title/
pretty_urls:
  trailing_index: true
  trailing_html: false

# 目录结构（一般无需修改）
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories

# 首页分页
index_generator:
  per_page: 10
  order_by: -date

# 主题
theme: typing

# 部署（保证已安装 hexo-deployer-git）
deploy:
  type: git
  repo: https://github.com/worms217/worms217.github.io.git
  branch: main
